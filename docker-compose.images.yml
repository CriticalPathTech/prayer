# Override that swaps the local `build:` blocks for prebuilt images
# from GHCR. Use it when you want to validate the published artifact
# without burning ~30s on a local Docker build.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.images.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.images.yml up
#
# Pin to a specific commit instead of the moving `:main` tag:
#   PRAYER_TAG=sha-<full-commit-sha> docker compose \
#     -f docker-compose.yml -f docker-compose.images.yml up
#
# `!reset` clears the inherited `build:` block from docker-compose.yml so
# compose pulls the image instead of trying to build from the local
# Dockerfile. Requires docker compose v2.24+ for !reset tag support.
services:
  api:
    image: ghcr.io/criticalpathtech/prayer-api:${PRAYER_TAG:-main}
    build: !reset null

  web:
    image: ghcr.io/criticalpathtech/prayer-web:${PRAYER_TAG:-main}
    build: !reset null
