name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      shared: ${{ steps.filter.outputs.shared }}
      root: ${{ steps.filter.outputs.root }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            db:
              - 'packages/db/**'
            shared:
              - 'packages/shared/**'
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc'
            docker:
              - 'docker-compose.yml'
              - 'docker/**'
              - 'apps/api/Dockerfile'
              - 'apps/web/Dockerfile'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  api-check:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prayer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prayer_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prayer_test
      AUTH_JWKS_URL: http://localhost:0/jwks
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO for storage integration tests
        run: |
          docker run -d --rm --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=prayer-dev-local \
            -e MINIO_ROOT_PASSWORD=prayer-dev-local-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 30 sh -c 'until curl -fs http://localhost:9000/minio/health/live; do sleep 1; done' \
            || (docker logs minio; exit 1)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prayer/shared build && pnpm --filter @prayer/db build
      - run: pnpm --filter @prayer/api typecheck
      - run: pnpm --filter @prayer/api test
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  web-check:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:3001
      VITE_AUTH_URL: http://localhost:0
      VITE_AUTH_ANON_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prayer/shared build
      - run: pnpm --filter @prayer/web typecheck
      - run: pnpm --filter @prayer/web test
      - run: pnpm --filter @prayer/web build

  db-check:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prayer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prayer_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prayer_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prayer/db test

  # End-to-end smoke against locally-built images. Confirms the Dockerfiles
  # + docker-compose.yml still produce a working OSS stack on every PR. No
  # registry push — images stay on the runner and are torn down with the stack.
  oss-smoke:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prayer/db --filter @prayer/shared build
      - run: pnpm --filter @prayer/web exec playwright install --with-deps chromium
      - name: Configure local env from example
        run: cp .env.example .env
      - name: Build images locally
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for api healthcheck
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3001/healthz > /dev/null; then
              echo "api healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --tail 100
          exit 1
      - name: Bootstrap users + posts
        run: pnpm bootstrap
      - name: Playwright OSS smoke
        run: pnpm --filter @prayer/web exec playwright test --project="iPhone SE" oss-stack-smoke
      - if: always()
        name: Capture compose logs
        run: |
          mkdir -p /tmp/stack-logs
          docker compose logs > /tmp/stack-logs/all.log 2>&1 || true
          docker compose ps > /tmp/stack-logs/ps.txt 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-${{ github.run_id }}
          path: /tmp/stack-logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

  # Single required check for branch protection; path-filtered jobs skip cleanly.
  ci-gate:
    needs: [changes, lint, api-check, web-check, db-check, oss-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
