# Dependabot config — see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy: ONE root npm entry covers all four pnpm workspaces (apps/api,
# apps/web, packages/db, packages/shared). The `groups` config bundles
# updates that have to move together — without grouping, Dependabot opens
# one PR per workspace per dependency, and any package shared across
# workspaces (kysely, vite/vitest) fails `pnpm install --frozen-lockfile`
# in CI because the lockfile expects all workspaces consistent.
#
# This is what bit us with PRs #2/#3/#4 in the post-launch audit.

version: 2

updates:
  # ---------- npm (pnpm workspaces) ----------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Kysely is in BOTH apps/api and packages/db. Bumping one workspace
      # alone breaks the lockfile.
      kysely:
        patterns:
          - 'kysely'

      # Vite + Vitest + plugins are version-coupled — Vitest N transitively
      # pulls Vite N, so bumping vite without vitest (or vice-versa) leaves
      # two vite versions resolved and breaks tsc-b across workspaces.
      vite-and-vitest:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@vitejs/*'
          - 'vite-plugin-*'

      # React + react-dom + types must move in lockstep.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@types/react'
          - '@types/react-dom'

      # ESLint family — multiple plugins pinned to the eslint major.
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'

      # Testing utilities — supertest + jest-dom + RTL move together.
      testing:
        patterns:
          - '@testing-library/*'
          - '@types/supertest'
          - 'supertest'

      # Catch-all for everything else, but ONLY patch + minor. Major bumps
      # of unlisted packages still get their own PR for individual review
      # (which is what you want for things like Express, jose, Postgres
      # client, etc.).
      patch-and-minor:
        update-types:
          - patch
          - minor

    # Pin a few packages to majors that match runtime / ecosystem reality.
    # Patch + minor updates still flow through via the relevant groups.
    #
    # - eslint / @eslint/js: eslint-plugin-react has no v10-compat release
    #   yet (peerDeps cap at ^9.7); shipping eslint 10 needs a pnpm-patch
    #   on the plugin, which is upstream-maintenance debt. Revisit when
    #   eslint-plugin-react publishes a v10-compat release. Context: PR #31.
    #
    # - @types/node: runtime is Node 24 (engines.node = ">=24", Docker
    #   uses node:24-alpine). @types/node majors track Node majors, so
    #   pinning to ^24 keeps types aligned with the runtime — a stray
    #   Node-25-only API call would crash at runtime but slip past tsc
    #   if types are ahead of the engine. Bump when the runtime moves to
    #   Node 25. Context: PR #47.
    #
    # - tailwindcss: v4 is a ground-up rewrite — CSS entry rewrite
    #   (`@tailwind base/components/utilities` → `@import "tailwindcss"`),
    #   PostCSS plugin swap to `@tailwindcss/postcss`, `tailwind.config.js`
    #   migration to a CSS `@theme` block, plus utility-class renames to
    #   audit across every component (the codebase uses lots of
    #   `theme(colors.…)` and arbitrary `[…]` values that need spot-checks).
    #   v3.4 is still security-supported and no third-party dep requires v4.
    #   Defer until we want a focused migration effort, not a chore-deps
    #   bump. Context: PR #36 (closed).
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']

  # ---------- GitHub Actions ----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'

  # ---------- Docker base images ----------
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(docker)
