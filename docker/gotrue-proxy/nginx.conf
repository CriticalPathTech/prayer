# Strips the `/auth/v1` prefix that the Supabase JS SDK adds to every
# auth call, so the SDK can talk to a self-hosted GoTrue (which serves
# at root paths). On hosted Supabase, Kong does this routing — locally
# we don't run Kong, so this nginx sits in front of GoTrue and does
# only that one job.
#
# Path mapping (all forwarded to the internal `gotrue` service):
#   /auth/v1/token            → /token
#   /auth/v1/admin/users      → /admin/users
#   /auth/v1/.well-known/...  → /.well-known/...
#   /auth/v1/anything-else    → /anything-else
#
# CORS is also handled here, not deferred to GoTrue. GoTrue's built-in
# CORS handler only allows a narrow set of request headers (it omits
# `apikey`, `x-client-info`, `x-supabase-api-version` that the Supabase
# JS SDK always sends), so relying on it makes browser preflights fail
# silently. We answer OPTIONS directly and override the CORS headers on
# all upstream responses so the SDK's defaults are accepted.

server {
    listen 8080;
    server_name _;

    # Health endpoint for the docker healthcheck — terminated here, not
    # forwarded, so the proxy reports healthy independently of GoTrue.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Strip /auth/v1 prefix and forward to GoTrue. Trailing slash on
    # both the location and the proxy_pass URI is what makes nginx
    # rewrite the matched prefix to the proxy_pass path.
    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'apikey, authorization, content-type, x-client-info, x-supabase-api-version, prefer, x-supabase-auth' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            add_header Content-Type 'text/plain' always;
            return 204;
        }

        proxy_pass http://gotrue:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide upstream's narrower CORS headers so our wider ones win.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Access-Control-Expose-Headers 'x-total-count, link, x-supabase-api-version' always;
    }

    # Pass-through for callers (or curl) that hit GoTrue's native
    # root paths directly. Useful for debugging and keeps the api's
    # internal JWKS fetch working if it ever gets pointed at the
    # proxy port instead of the container directly.
    location / {
        proxy_pass http://gotrue:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
